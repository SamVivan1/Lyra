services:
  music-automation:
    build: .
    container_name: lyra
    restart: unless-stopped
    network_mode: host
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    command: ["python", "main.py", "--loop", "--interval", "3600"]
    volumes:
      - /mnt/Storage2/data/media/Music:/mnt/Storage2/data/media/Music
      - /DATA/Downloads:/DATA/Downloads
      # Mount the database directory so the SQLite state is persistent
      - ./data:/app/data
    environment:
      - DB_PATH=/app/data/music_automation.db
      - TZ=Asia/Jakarta
      - MAX_ARTISTS_PER_RUN=10
      - FALLBACK_HOURS=6
