name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A push to a branch supersedes its own in-flight run; other branches are
# unaffected because the ref is part of the group.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # No .env and no credentials exist on the runner: the suite must pass
      # hermetically, and the autouse isolated_db fixture keeps every test's
      # database inside pytest's tmp_path.
      - name: Test
        run: pytest --cov=lyra.database --cov-fail-under=70

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        run: mypy src

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Proves the image still builds from the shipped context; the image
      # contents are asserted by tests/test_docker_context.py.
      - name: Build image
        run: docker build .
