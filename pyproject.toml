[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra"
version = "1.0.0"
description = "Self-hosted music automation that integrates ListenBrainz, Lidarr, and YouTube fallback downloads."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lyra Contributors" }]
dependencies = [
    "requests>=2.31.0",
    "yt-dlp>=2024.04.09,<2027.0",
    "python-dotenv>=1.0.1",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "mutagen>=1.47.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0"
]

[project.scripts]
lyra = "lyra.main:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["lyra*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
# The existing codebase is not formatter-clean; 120 keeps E501 enforced without
# rewriting unrelated modules. Only the one line above it is wrapped by hand.
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Focused ruleset: pycodestyle errors, pyflakes, import sorting.
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
# Third-party packages without stubs (yt-dlp, rich, questionary, ...) must not
# stop the type check; this is deliberately permissive, not strict.
ignore_missing_imports = true
warn_unused_configs = true

